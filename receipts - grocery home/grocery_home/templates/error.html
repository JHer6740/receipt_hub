{% extends "base.html" %}
{% block title %}Something went wrong · Grocery Home{% endblock %}
{% block content %}
<section class="error-page">
  <span class="error-code">{{ status_code }}</span>
  <p class="eyebrow">Grocery Home</p>
  <h1>{{ heading }}</h1>
  <p>{{ message }}</p>
  <a class="button button-primary" href="{{ destination|default('/') }}">{{ action_label|default('Return home') }}</a>
</section>
{% endblock %}
